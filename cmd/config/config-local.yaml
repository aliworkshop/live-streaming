name: live-streaming

http:
  address: ":9000"
  gracefullyShutdownTimeout: 10s

auth:
  # Override with JWT_SECRET env var in production. Don't commit a real secret.
  jwtSecret: "change-me-please"
  accessExpiry: 24h

stream:
  # Root directory containing media/<channel>/<show>/index.m3u8 (multi-show
  # mode) or media/<channel>/index.m3u8 (single-show mode).
  mediaDir: "media"

# Re-stream remote HLS sources through this server. Each channel is exposed
# at /stream/<name>.m3u8 — pick names that don't collide with the on-disk
# channels above (`tv`, `fm`). The proxy rewrites every URI in the master
# and variant playlists so segments and sub-playlists ride through here too,
# which means cross-origin HLS players (HLS.js) just work.
externalChannels:
  - name: lenz
    url: "https://live.lenzsport.net/plus/plus.stream/playlists.m3u8"
  # Mux test live — 5 variants, 270p..1080p, low-latency HLS.
  - name: mux-live
    url: "https://stream.mux.com/v69RSHhFelSm4701snP22dYz2jICy4E4FUyk02rW4gxRM.m3u8"
  # Red Bull TV 24/7 — 6 variants, 180p..1080p, action sports + lifestyle.
  - name: redbull
    url: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8"
  # TRT World 24/7 English news — 5 variants, 360p..1440p (2K).
  - name: trt-world
    url: "https://tv-trtworld.medya.trt.com.tr/master.m3u8"
  - name: dw-english
    url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8"
  - name: france24-en
    url: "https://static.france24.com/live/F24_EN_HI_HLS/live_web.m3u8"
  - name: nasa-tv
    url: "https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8"
  # YouTube live — kind:youtube tells the proxy to shell out to yt-dlp at
  # request time and cache the resolved HLS master for 5 minutes. Requires
  # `yt-dlp` on PATH (`brew install yt-dlp`).
  - name: yt
    kind: youtube
    url: "https://www.youtube.com/watch?v=EmmAVsyzd1s
    "

uploads:
  # Where teachers' PDFs (and any future uploads) are stored on disk. Files
  # are served back at /uploads/<uuid>.pdf. Add this directory to .gitignore
  # if you don't want uploads tracked.
  dir: "uploads"
  maxMB: 200

tunnel:
  # When true, spawn cloudflared on startup so browser HTTPS is available
  # for remote devices (required for getUserMedia camera/mic).
  useCloudflared: true
  # If both name and hostname are set, runs a *named* tunnel — stable URL
  # across restarts. Otherwise falls back to a quick trycloudflare.com
  # tunnel whose URL changes every run.
  #
  # One-time setup before launching the app:
  #   cloudflared tunnel login
  #   cloudflared tunnel create  live-streaming
  #   cloudflared tunnel route dns live-streaming stream.example.com
  name: ""
  hostname: ""

webDir: "web"